<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Slither - ネオンヘビ対戦ゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0f18;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.5);
        }
    </style>
</head>
<body class="relative w-screen h-screen bg-[#0d0f18] text-white">

    <!-- ゲームキャンバス -->
    <canvas id="gameCanvas" class="absolute inset-0 w-full h-full cursor-crosshair"></canvas>

    <!-- UI: スコア・長さ表示 (左上) -->
    <div id="uiOverlay" class="absolute top-4 left-4 pointer-events-none flex flex-col gap-1 bg-black/40 backdrop-blur-md p-4 rounded-xl border border-white/10 shadow-lg select-none">
        <div class="text-xs text-cyan-400 font-semibold tracking-wider">STATUS</div>
        <div class="text-xl font-bold tracking-wide">スコア: <span id="scoreVal" class="text-cyan-300">0</span></div>
        <div class="text-sm text-gray-300">長さ: <span id="lengthVal" class="text-emerald-300">10</span></div>
        <div class="text-xs text-gray-400 mt-1">操作: マウス/タップ移動、右下ボタンでブースト</div>
    </div>

    <!-- UI: リーダーボード (右上) -->
    <div class="absolute top-4 right-4 pointer-events-none bg-black/40 backdrop-blur-md p-4 rounded-xl border border-white/10 shadow-lg w-48">
        <div class="text-xs text-purple-400 font-semibold tracking-wider mb-2">LEADERBOARD</div>
        <div id="leaderboard" class="flex flex-col gap-1.5 text-sm">
            <!-- 動的生成 -->
        </div>
    </div>

    <!-- ブーストボタン (右下) -->
    <div class="absolute bottom-6 right-6 z-40 select-none">
        <button id="boostBtn" class="w-20 h-20 rounded-full bg-gradient-to-r from-cyan-500/80 to-blue-600/80 border-2 border-cyan-300 text-white font-bold flex flex-col items-center justify-center shadow-lg shadow-cyan-500/50 active:scale-95 transition backdrop-blur-md touch-none">
            <span class="text-xl">⚡</span>
            <span class="text-xs tracking-wider">BOOST</span>
        </button>
    </div>

    <!-- スタート画面 / ゲームオーバー画面 -->
    <div id="menuScreen" class="absolute inset-0 bg-black/80 backdrop-blur-md flex flex-col items-center justify-center z-50">
        <div class="text-center max-w-lg p-8 bg-gradient-to-b from-gray-900/90 to-black/90 rounded-2xl border border-cyan-500/30 shadow-2xl">
            <h1 class="text-5xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 mb-2 glow-text">
                NEON SLITHER
            </h1>
            <p class="text-gray-400 text-sm mb-6">光るつぶを集めて長くなり、敵のヘビを自分の体にぶつけて倒そう！</p>
            
            <div class="mb-6 text-left bg-white/5 p-4 rounded-lg border border-white/10 text-xs text-gray-300 space-y-2">
                <p>✨ <b>つぶ集め:</b> マップ上の光るつぶを食べるとスコアと長さがアップ</p>
                <p>🐍 <b>攻撃:</b> 自分の体に敵の頭をぶつけると敵が光るつぶに変化</p>
                <p>⚡ <b>ブースト:</b> 右下のボタンを押すと加速（長さと引き換えにつぶを放出）</p>
            </div>

            <button id="startBtn" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg shadow-cyan-500/30 transition transform active:scale-95 text-lg tracking-wide">
                ゲームスタート
            </button>
            <div id="finalScoreContainer" class="hidden mt-4 text-gray-300 text-sm">
                最終スコア: <span id="finalScore" class="font-bold text-cyan-400">0</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 画面リサイズ対応
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ゲーム世界の設定
        const WORLD_SIZE = 4000;
        let gameRunning = false;
        let score = 0;

        // マウス/タッチ位置とブーストフラグ
        const mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let isBoosting = false;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches[0]) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        // ブーストボタンのイベント設定
        const boostBtn = document.getElementById('boostBtn');

        const startBoost = (e) => {
            e.preventDefault();
            isBoosting = true;
        };
        const stopBoost = (e) => {
            e.preventDefault();
            isBoosting = false;
        };

        boostBtn.addEventListener('mousedown', startBoost);
        boostBtn.addEventListener('mouseup', stopBoost);
        boostBtn.addEventListener('mouseleave', stopBoost);
        boostBtn.addEventListener('touchstart', startBoost);
        boostBtn.addEventListener('touchend', stopBoost);
        boostBtn.addEventListener('touchcancel', stopBoost);

        // フード（光るつぶ）クラス
        class Food {
            constructor(x, y, color = null, size = 4) {
                this.x = x || Math.random() * WORLD_SIZE;
                this.y = y || Math.random() * WORLD_SIZE;
                this.size = size;
                this.color = color || `hsl(${Math.random() * 360}, 100%, 70%)`;
                this.pulse = Math.random() * Math.PI;
            }
            draw(cameraX, cameraY) {
                this.pulse += 0.1;
                const currentSize = this.size + Math.sin(this.pulse) * 1;
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x - cameraX, this.y - cameraY, currentSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ヘビクラス (プレイヤー & AI共通)
        class Snake {
            constructor(name, x, y, color, isAI = false) {
                this.name = name;
                this.isAI = isAI;
                this.color = color;
                this.angle = Math.random() * Math.PI * 2;
                this.baseSpeed = 3.2;
                this.boostSpeed = 5.5;
                this.radius = 12;
                this.segments = [];
                this.targetLength = 25; // 初期長さ
                this.score = 0;
                this.isDead = false;
                this.aiTimer = 0;

                // 初期位置にセグメントを配置
                for (let i = 0; i < this.targetLength; i++) {
                    this.segments.push({
                        x: x - Math.cos(this.angle) * i * 4,
                        y: y - Math.sin(this.angle) * i * 4
                    });
                }
            }

            update(foods, snakes) {
                if (this.isDead) return;

                let currentSpeed = this.baseSpeed;

                if (!this.isAI) {
                    // プレイヤーの移動制御
                    const dx = mouse.x - canvas.width / 2;
                    const dy = mouse.y - canvas.height / 2;
                    if (dx !== 0 || dy !== 0) {
                        const targetAngle = Math.atan2(dy, dx);
                        // スムーズな旋回
                        let angleDiff = targetAngle - this.angle;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        this.angle += angleDiff * 0.15;
                    }

                    // 右下ボタンが押されている時だけブースト（長さ消費＆つぶ放出）
                    if (isBoosting && this.targetLength > 15) {
                        currentSpeed = this.boostSpeed;
                        if (Math.random() < 0.3) {
                            this.targetLength = Math.max(12, this.targetLength - 0.2);
                            const tail = this.segments[this.segments.length - 1];
                            foods.push(new Food(
                                tail.x + (Math.random() - 0.5) * 15,
                                tail.y + (Math.random() - 0.5) * 15,
                                '#ffffff',
                                5
                            ));
                        }
                    }
                } else {
                    // AIの動作
                    this.aiTimer++;
                    if (this.aiTimer > 100 + Math.random() * 100) {
                        this.aiTimer = 0;
                        this.targetAngle = Math.random() * Math.PI * 2;
                    }
                    if (this.targetAngle !== undefined) {
                        let angleDiff = this.targetAngle - this.angle;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        this.angle += angleDiff * 0.05;
                    }
                    // 壁に近づいたら中央へ向かう
                    const head = this.segments[0];
                    if (head.x < 300 || head.x > WORLD_SIZE - 300 || head.y < 300 || head.y > WORLD_SIZE - 300) {
                        this.targetAngle = Math.atan2(WORLD_SIZE / 2 - head.y, WORLD_SIZE / 2 - head.x);
                    }
                }

                // 頭の位置を更新
                const head = this.segments[0];
                const newX = head.x + Math.cos(this.angle) * currentSpeed;
                const newY = head.y + Math.sin(this.angle) * currentSpeed;

                // ワールド境界チェック
                if (newX < 0 || newX > WORLD_SIZE || newY < 0 || newY > WORLD_SIZE) {
                    if (!this.isAI) {
                        this.die(foods);
                        return;
                    } else {
                        this.angle += Math.PI; // AIは壁で反転
                    }
                }

                // 新しい頭を挿入
                this.segments.unshift({ x: Math.max(0, Math.min(WORLD_SIZE, newX)), y: Math.max(0, Math.min(WORLD_SIZE, newY)) });

                // 長さ調整
                while (this.segments.length > Math.floor(this.targetLength)) {
                    this.segments.pop();
                }

                // フードとの当たり判定
                for (let i = foods.length - 1; i >= 0; i--) {
                    const f = foods[i];
                    const dist = Math.hypot(this.segments[0].x - f.x, this.segments[0].y - f.y);
                    if (dist < this.radius + f.size) {
                        this.targetLength += 0.5;
                        this.score += Math.floor(f.size * 2);
                        foods.splice(i, 1);
                        // 新しいフードを補充
                        foods.push(new Food());
                    }
                }
            }

            draw(cameraX, cameraY) {
                if (this.isDead) return;

                ctx.save();
                // 体の描画（後ろから前へ）
                for (let i = this.segments.length - 1; i >= 0; i--) {
                    const seg = this.segments[i];
                    const progress = i / this.segments.length;
                    const currentRadius = this.radius * (1 - progress * 0.3);

                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(seg.x - cameraX, seg.y - cameraY, currentRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 頭の目玉描画
                const head = this.segments[0];
                const eyeOffset = 6;
                const eyeAngle1 = this.angle + Math.PI / 4;
                const eyeAngle2 = this.angle - Math.PI / 4;

                const eye1x = head.x - cameraX + Math.cos(eyeAngle1) * eyeOffset;
                const eye1y = head.y - cameraY + Math.sin(eyeAngle1) * eyeOffset;
                const eye2x = head.x - cameraX + Math.cos(eyeAngle2) * eyeOffset;
                const eye2y = head.y - cameraY + Math.sin(eyeAngle2) * eyeOffset;

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(eye1x, eye1y, 4, 0, Math.PI * 2);
                ctx.arc(eye2x, eye2y, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(eye1x + Math.cos(this.angle) * 1.5, eye1y + Math.sin(this.angle) * 1.5, 2, 0, Math.PI * 2);
                ctx.arc(eye2x + Math.cos(this.angle) * 1.5, eye2y + Math.sin(this.angle) * 1.5, 2, 0, Math.PI * 2);
                ctx.fill();

                // ネームタグ描画
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(this.name, head.x - cameraX, head.y - cameraY - 20);

                ctx.restore();
            }

            die(foods) {
                this.isDead = true;
                // 体のセグメントごとに光るつぶを生成
                this.segments.forEach((seg, idx) => {
                    if (idx % 2 === 0) {
                        foods.push(new Food(seg.x + (Math.random() - 0.5) * 15, seg.y + (Math.random() - 0.5) * 15, this.color, 7));
                    }
                });
            }
        }

        // ゲーム変数
        let player;
        let enemies = [];
        let foods = [];
        const camera = { x: 0, y: 0 };

        function initGame() {
            score = 0;
            foods = [];
            enemies = [];

            // フード生成
            for (let i = 0; i < 400; i++) {
                foods.push(new Food());
            }

            // プレイヤー作成
            player = new Snake("あなた", WORLD_SIZE / 2, WORLD_SIZE / 2, '#00f3ff', false);

            // AI敵ヘビ作成
            const aiNames = ["Shadow", "Viper", "Python", "Cobra", "Titan", "Blaze", "NeonSnake", "Frost"];
            const aiColors = ['#ff0055', '#a200ff', '#00ff66', '#ffaa00', '#ff00ea', '#00ffcc'];
            
            for (let i = 0; i < 8; i++) {
                const rx = Math.random() * (WORLD_SIZE - 1000) + 500;
                const ry = Math.random() * (WORLD_SIZE - 1000) + 500;
                const color = aiColors[i % aiColors.length];
                const ai = new Snake(aiNames[i], rx, ry, color, true);
                ai.targetLength = 30 + Math.random() * 40;
                enemies.push(ai);
            }
        }

        // 衝突判定とゲームロジック
        function updateGame() {
            if (!gameRunning) return;

            // プレイヤー更新
            player.update(foods, enemies);

            // カメラ追従
            if (!player.isDead) {
                camera.x += (player.segments[0].x - canvas.width / 2 - camera.x) * 0.1;
                camera.y += (player.segments[0].y - canvas.height / 2 - camera.y) * 0.1;
            }

            // AI更新
            enemies.forEach(enemy => {
                enemy.update(foods, [player, ...enemies]);
            });

            // 死亡したAIの再スポーン処理
            enemies.forEach((enemy, idx) => {
                if (enemy.isDead) {
                    const rx = Math.random() * (WORLD_SIZE - 1000) + 500;
                    const ry = Math.random() * (WORLD_SIZE - 1000) + 500;
                    const aiColors = ['#ff0055', '#a200ff', '#00ff66', '#ffaa00', '#ff00ea', '#00ffcc'];
                    enemies[idx] = new Snake(enemy.name, rx, ry, aiColors[Math.floor(Math.random() * aiColors.length)], true);
                    enemies[idx].targetLength = 25 + Math.random() * 30;
                }
            });

            // --- 敵の頭を自分の体にぶつけて倒す判定 ---
            if (!player.isDead) {
                const pHead = player.segments[0];
                enemies.forEach(enemy => {
                    if (enemy.isDead) return;
                    const eHead = enemy.segments[0];

                    // 1. プレイヤーの頭が敵の体にぶつかった場合 -> プレイヤー死亡
                    for (let i = 1; i < enemy.segments.length; i++) {
                        const seg = enemy.segments[i];
                        if (Math.hypot(pHead.x - seg.x, pHead.y - seg.y) < player.radius + 4) {
                            player.die(foods);
                            gameOver();
                            return;
                        }
                    }

                    // 2. 敵の頭がプレイヤーの体にぶつかった場合 -> 敵が死亡して光るつぶに！
                    for (let i = 1; i < player.segments.length; i++) {
                        const seg = player.segments[i];
                        if (Math.hypot(eHead.x - seg.x, eHead.y - seg.y) < enemy.radius + 4) {
                            enemy.die(foods);
                            score += 500; // 撃破ボーナス
                            player.targetLength += 5; // 報酬として少し長くなる
                            break;
                        }
                    }
                });
            }

            // プレイヤー死亡チェック
            if (player.isDead) {
                gameOver();
            }

            // UI更新
            document.getElementById('scoreVal').innerText = player.score + score;
            document.getElementById('lengthVal').innerText = Math.floor(player.targetLength);

            updateLeaderboard();
        }

        // リーダーボード更新
        function updateLeaderboard() {
            const allSnakes = [player, ...enemies].filter(s => !s.isDead);
            allSnakes.sort((a, b) => b.targetLength - a.targetLength);

            const lbEl = document.getElementById('leaderboard');
            lbEl.innerHTML = '';
            allSnakes.slice(0, 5).forEach((s, index) => {
                const item = document.createElement('div');
                item.className = `flex justify-between items-center text-xs ${s === player ? 'text-cyan-300 font-bold' : 'text-gray-300'}`;
                item.innerHTML = `<span>#${index + 1} ${s.name}</span><span>${Math.floor(s.targetLength)}</span>`;
                lbEl.appendChild(item);
            });
        }

        // 描画処理
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 六角形グリッド背景の描画
            ctx.save();
            ctx.strokeStyle = '#161a29';
            ctx.lineWidth = 1;
            const gridSize = 60;
            const startX = -Math.floor(camera.x % gridSize);
            const startY = -Math.floor(camera.y % gridSize);

            for (let x = startX; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = startY; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            ctx.restore();

            // ワールド境界線の描画
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 0, 85, 0.4)';
            ctx.lineWidth = 4;
            ctx.strokeRect(-camera.x, -camera.y, WORLD_SIZE, WORLD_SIZE);
            ctx.restore();

            // フードの描画
            foods.forEach(f => {
                // 画面内にあるものだけ描画
                if (f.x > camera.x - 50 && f.x < camera.x + canvas.width + 50 &&
                    f.y > camera.y - 50 && f.y < camera.y + canvas.height + 50) {
                    f.draw(camera.x, camera.y);
                }
            });

            // 敵の描画
            enemies.forEach(enemy => enemy.draw(camera.x, camera.y));

            // プレイヤー描画
            if (player) player.draw(camera.x, camera.y);
        }

        // メインゲームループ
        function gameLoop() {
            updateGame();
            drawGame();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        // ゲームオーバー処理
        function gameOver() {
            gameRunning = false;
            document.getElementById('menuScreen').classList.remove('hidden');
            document.getElementById('startBtn').innerText = 'もう一度プレイ';
            document.getElementById('finalScoreContainer').classList.remove('hidden');
            document.getElementById('finalScore').innerText = player.score + score;
        }

        // スタートボタンイベント
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('menuScreen').classList.add('hidden');
            initGame();
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        });
    </script>
</body>
</html>
